name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - run: php examples/simulation.php
      - run: python3 tests/transport-smoke.py
      - run: python3 tests/checkout-smoke.py
  release-alpha:
    name: Publish alpha prerelease
    needs: test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'gatomontes/athmovil-php' &&
      github.event.head_commit.message == 'Release v0.1.0-alpha.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish the tested commit as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create v0.1.0-alpha.1
          --target "$GITHUB_SHA"
          --prerelease
          --latest=false
          --title "ATH Móvil PHP v0.1.0-alpha.1"
          --notes-file docs/releases/v0.1.0-alpha.1.md
